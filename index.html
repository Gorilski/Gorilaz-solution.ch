<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORILAZ Consulting</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6fa;
color:#222;
}

header{
background:linear-gradient(135deg,#020817,#071d55,#0b1f6d);
color:white;
padding:25px;
}

.topbar{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:65px;
height:65px;
border-radius:14px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
color:white;
}

.brand h1{
font-size:24px;
margin-bottom:4px;
}

.brand p{
font-size:12px;
opacity:.9;
}

.lang{
display:flex;
gap:10px;
}

.lang button{
background:none;
border:none;
color:white;
font-size:11px;
font-weight:600;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
margin-bottom:18px;
box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
font-size:18px;
color:#0b1f6d;
margin-bottom:12px;
}

p{
font-size:13px;
line-height:1.7;
margin-bottom:8px;
}

ul{
padding-left:20px;
}

li{
font-size:13px;
margin-bottom:7px;
}

.whatsapp{
display:inline-flex;
justify-content:center;
align-items:center;
width:42px;
height:42px;
background:#25D366;
color:white;
border-radius:50%;
text-decoration:none;
font-size:20px;
}

.linkedin{
display:inline-flex;
justify-content:center;
align-items:center;
width:42px;
height:42px;
background:#0077B5;
color:white;
border-radius:50%;
text-decoration:none;
font-size:18px;
margin-left:10px;
}

footer{
background:#051b4d;
color:white;
text-align:center;
padding:18px;
font-size:12px;
margin-top:20px;
}

</style>

</head>
<body>

<header>

<div class="topbar">

<div class="left">

<div class="brand">

</div>

</div>

<div class="lang">

</div>

</div>

</header>
